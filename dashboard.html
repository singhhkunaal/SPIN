          </p>
        </div>
        <div>
          <Eyebrow>Promoting a category</Eyebrow>
          <p style={{ marginTop: 8, color: "#4a5568", lineHeight: 1.6 }}>
            To add a non-modeled category to the savings model, recategorize its vendors on the
            Vendors tab into a modeled category, or extend the model in the source data.
          </p>
        </div>
      </div>
    </div>
  );
}

function NonModeledRow({ category, total }) {
  const { toggleCategoryFilter, filters, colorForArea } = useStore();
  const isActive = filters.category === category.id;
  return (
    <tr
      onClick={() => toggleCategoryFilter(category.id)}
      style={{
        borderBottom: "1px solid rgba(11,18,32,0.05)",
        background: isActive ? "rgba(15,118,110,0.06)" : "transparent",
        cursor: "pointer",
      }}>
      <td style={{ padding: "12px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <Dot color={colorForArea(category.area)} size={8} />
          <span style={{
            fontFamily: "'Geist', sans-serif", fontSize: 12.5,
            color: "#0b1220", fontWeight: isActive ? 600 : 500,
          }}>{category.name}</span>
        </div>
      </td>
      <td style={{
        padding: "12px 16px", fontSize: 11.5, color: "#4a5568",
        whiteSpace: "nowrap",
      }}>{category.area}</td>
      <td style={{
        padding: "12px 16px", textAlign: "right",
        fontFamily: "'JetBrains Mono', monospace", fontSize: 12,
        color: "#0b1220", whiteSpace: "nowrap",
      }}>{fmtMoney(category.liveSpend, { decimals: 2 })}</td>
      <td style={{
        padding: "12px 16px", textAlign: "right",
        fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5,
        color: "#4a5568",
      }}>{category.vendorCount}</td>
      <td style={{
        padding: "12px 16px", textAlign: "right",
        fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
        color: "#6b7280",
      }}>{(category.liveSpend / (total || 1) * 100).toFixed(2)}%</td>
    </tr>
  );
}

function CategoryDetail({ category }) {
  const { filteredVendors, colorForArea } = useStore();
  const inCat = filteredVendors.filter(v => v.category === category.name)
    .sort((a, b) => b.spend - a.spend)
    .slice(0, 8);

  return (
    <div style={{
      display: "grid",
      gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))",
      gap: 28, paddingTop: 16,
    }}>
      <div>
        <Eyebrow>Top vendors in category</Eyebrow>
        <div style={{ marginTop: 14 }}>
          {inCat.length > 0 ? (
            <HBar
              data={inCat.map(v => ({
                label: v.name, value: v.spend, color: colorForArea(v.area),
              }))}
              maxBars={8}
            />
          ) : (
            <div style={{ color: "#6b7280", fontSize: 12, fontStyle: "italic" }}>
              No vendors in this category for the current filters.
            </div>
          )}
        </div>
      </div>
      <div>
        <Eyebrow>Monthly trend</Eyebrow>
        <div style={{ marginTop: 14 }}>
          <MonthlyBars
            data={category.monthly.map(m => ({ month: fmtMonth(m.month), amount: m.amount }))}
            height={140}
            color={colorForArea(category.area)}
          />
        </div>
        <p style={{
          fontFamily: "'Geist', sans-serif", fontSize: 12,
          color: "#4a5568", lineHeight: 1.6, marginTop: 16, fontStyle: "italic",
        }}>{category.note}</p>
      </div>
    </div>
  );
}

function VendorsView() {
  const { vendors, filteredVendors, recategorize, allAreaNames, allCategoryNames,
          colorForArea, filters, timeRange, filtersActive, toggleAreaFilter } = useStore();
  const [search, setSearch] = React.useState("");
  const [catFilter, setCatFilter] = React.useState("all");
  const [sortBy, setSortBy] = React.useState("spend");
  const [editingId, setEditingId] = React.useState(null);

  const list = React.useMemo(() => {
    let xs = filteredVendors;
    if (search) {
      const q = search.toLowerCase();
      xs = xs.filter(v => v.name.toLowerCase().includes(q));
    }
    if (catFilter !== "all") xs = xs.filter(v => v.category === catFilter);
    xs = [...xs].sort((a, b) => {
      if (sortBy === "spend") return b.spend - a.spend;
      if (sortBy === "name") return a.name.localeCompare(b.name);
      if (sortBy === "txns") return b.txns - a.txns;
      if (sortBy === "area") return a.area.localeCompare(b.area);
      return 0;
    });
    return xs;
  }, [filteredVendors, search, catFilter, sortBy]);

  const totalShown = list.reduce((s, v) => s + v.spend, 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Panel
        title="Vendor Master"
        subtitle={`${list.length} of ${vendors.length} vendors${filtersActive ? ` matching filters` : ``} · ${fmtMoney(totalShown, { decimals: 2 })} spend in view`}
        padded={false}
      >
        <div style={{
          padding: "14px 20px", borderBottom: "1px solid rgba(11,18,32,0.06)",
          display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap",
        }}>
          <SearchInput value={search} onChange={setSearch}
            placeholder="Search vendors…" width={260} />
          <Select
            value={catFilter}
            onChange={setCatFilter}
            options={[
              { value: "all", label: "All categories (local)" },
              ...allCategoryNames.map(c => ({ value: c, label: c })),
            ]}
          />
          <Select
            value={sortBy}
            onChange={setSortBy}
            options={[
              { value: "spend", label: "Sort: Spend ↓" },
              { value: "name", label: "Sort: Name A–Z" },
              { value: "txns", label: "Sort: Transactions ↓" },
              { value: "area", label: "Sort: Area A–Z" },
            ]}
          />
          <div style={{ flex: 1 }} />
          <div style={{
            fontFamily: "'Geist', sans-serif", fontSize: 11, color: "#6b7280",
            whiteSpace: "nowrap",
          }}>
            Click area or category to reassign
          </div>
        </div>

        <div style={{ overflowX: "auto" }}>
        <table style={{
          width: "100%", borderCollapse: "collapse", minWidth: 980,
          fontFamily: "'Geist', sans-serif",
        }}>
          <thead>
            <tr style={{ borderBottom: "1px solid rgba(11,18,32,0.10)" }}>
              {[
                { label: "Vendor", align: "left" },
                { label: "Area", align: "left" },
                { label: "Category", align: "left" },
                { label: "Spend", align: "right" },
                { label: "Txns", align: "right" },
                { label: "% of total", align: "right" },
              ].map((h, i) => (
                <th key={i} style={{
                  textAlign: h.align,
                  fontSize: 10, fontWeight: 500,
                  textTransform: "uppercase", letterSpacing: "0.10em",
                  color: "#6b7280", padding: "12px 16px", whiteSpace: "nowrap",
                }}>{h.label}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {list.length === 0 && (
              <tr>
                <td colSpan={6} style={{
                  padding: "48px 24px", textAlign: "center",
                  fontFamily: "'Newsreader', serif", fontSize: 18,
                  fontStyle: "italic", color: "#6b7280",
                }}>
                  No vendors match — try adjusting filters or search.
                </td>
              </tr>
            )}
            {list.slice(0, 200).map(v => (
              <VendorRow
                key={v.id}
                vendor={v}
                colorForArea={colorForArea}
                totalShown={totalShown}
                isEditing={editingId === v.id}
                onToggleEdit={() => setEditingId(editingId === v.id ? null : v.id)}
                allAreas={allAreaNames}
                allCategories={allCategoryNames}
                recategorize={recategorize}
              />
            ))}
            {list.length > 200 && (
              <tr>
                <td colSpan={6} style={{
                  padding: "20px 16px", textAlign: "center",
                  fontFamily: "'Geist', sans-serif", fontSize: 11.5, color: "#6b7280",
                }}>
                  Showing top 200 of {list.length} vendors. Refine search or filters to narrow.
                </td>
              </tr>
            )}
          </tbody>
        </table>
        </div>
      </Panel>
    </div>
  );
}

function VendorRow({ vendor: v, colorForArea, totalShown, isEditing, onToggleEdit,
                     allAreas, allCategories, recategorize }) {
  const needsReview = v.area === "Requires Review" || v.category === "Requires Review";
  return (
    <tr style={{
      borderBottom: "1px solid rgba(11,18,32,0.05)",
      background: needsReview ? "rgba(245,158,11,0.05)" : "transparent",
    }}>
      <td style={{ padding: "10px 16px" }}>
        <div style={{
          fontFamily: "'Geist', sans-serif", fontSize: 12.5,
          color: "#0b1220", fontWeight: 500, whiteSpace: "nowrap",
          maxWidth: 280, overflow: "hidden", textOverflow: "ellipsis",
        }}>{v.name}</div>
      </td>
      <td style={{ padding: "10px 16px", position: "relative" }}>
        <CategoryChip
          label={v.area}
          color={colorForArea(v.area)}
          needsReview={v.area === "Requires Review"}
          onClick={onToggleEdit}
        />
      </td>
      <td style={{ padding: "10px 16px", position: "relative" }}>
        <CategoryChip
          label={v.category}
          color={colorForArea(v.area)}
          needsReview={v.category === "Requires Review"}
          onClick={onToggleEdit}
        />
        {isEditing && (
          <RecategorizeMenu
            current={{ area: v.area, category: v.category }}
            allAreas={allAreas}
            allCategories={allCategories}
            onSelect={({ area, category }) => {
              recategorize(v.id, { area, category });
              onToggleEdit();
            }}
            onClose={onToggleEdit}
          />
        )}
      </td>
      <td style={{
        padding: "10px 16px", textAlign: "right",
        fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5,
        color: "#0b1220", whiteSpace: "nowrap",
      }}>{fmtMoney(v.spend, { decimals: 2 })}</td>
      <td style={{
        padding: "10px 16px", textAlign: "right",
        fontFamily: "'JetBrains Mono', monospace", fontSize: 12,
        color: "#4a5568",
      }}>{v.txns.toLocaleString()}</td>
      <td style={{
        padding: "10px 16px", textAlign: "right",
        fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
        color: "#6b7280",
      }}>{(v.spend / (totalShown || 1) * 100).toFixed(2)}%</td>
    </tr>
  );
}

function CategoryChip({ label, color, needsReview, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        display: "inline-flex", alignItems: "center", gap: 6,
        padding: "4px 10px", whiteSpace: "nowrap",
        maxWidth: 280, overflow: "hidden", textOverflow: "ellipsis",
        background: needsReview ? "rgba(245,158,11,0.12)" : `${color}14`,
        border: `1px solid ${needsReview ? "rgba(245,158,11,0.30)" : `${color}40`}`,
        borderRadius: 2, cursor: "pointer",
        fontFamily: "'Geist', sans-serif", fontSize: 11.5,
        color: needsReview ? "#92400e" : color, fontWeight: 500,
      }}
    >
      <Dot color={color} size={7} />
      <span style={{ maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis" }}>{label}</span>
      <svg width={10} height={6} viewBox="0 0 10 6" style={{ flexShrink: 0 }}>
        <path d="M1 1l4 4 4-4" stroke="currentColor" strokeWidth="1.4"
          fill="none" strokeLinecap="round" />
      </svg>
    </button>
  );
}

function RecategorizeMenu({ current, allAreas, allCategories, onSelect, onClose }) {
  const { colorForArea } = useStore();
  const [tab, setTab] = React.useState("category");
  React.useEffect(() => {
    const close = e => {
      if (!e.target.closest("[data-recat-menu]")) onClose();
    };
    setTimeout(() => document.addEventListener("click", close), 0);
    return () => document.removeEventListener("click", close);
  }, []);

  return (
    <div
      data-recat-menu
      style={{
        position: "absolute", top: "100%", left: 16, marginTop: 4,
        background: "#fff", border: "1px solid rgba(11,18,32,0.16)",
        borderRadius: 2, boxShadow: "0 8px 24px rgba(11,18,32,0.16)",
        zIndex: 100, minWidth: 300, maxHeight: 360, overflow: "hidden",
        display: "flex", flexDirection: "column",
      }}>
      <div style={{
        display: "flex", borderBottom: "1px solid rgba(11,18,32,0.08)",
      }}>
        {[
          { id: "category", label: "Category" },
          { id: "area",     label: "Area" },
        ].map(t => (
          <button key={t.id} onClick={e => { e.stopPropagation(); setTab(t.id); }}
            style={{
              flex: 1, padding: "10px 14px", border: "none",
              background: tab === t.id ? "#f5f1ea" : "transparent",
              fontFamily: "'Geist', sans-serif", fontSize: 11,
              fontWeight: tab === t.id ? 600 : 500,
              color: tab === t.id ? "#0b1220" : "#6b7280",
              textTransform: "uppercase", letterSpacing: "0.10em",
              cursor: "pointer", borderBottom: tab === t.id ? "2px solid #0b1220" : "none",
            }}>{t.label}</button>
        ))}
      </div>
      <div style={{ overflowY: "auto", flex: 1 }}>
        {tab === "category" && allCategories.map(c => (
          <button
            key={c}
            onClick={e => { e.stopPropagation(); onSelect({ category: c }); }}
            style={{
              display: "flex", alignItems: "center", gap: 10,
              width: "100%", padding: "9px 14px",
              border: "none",
              background: c === current.category ? "rgba(15,118,110,0.06)" : "transparent",
              textAlign: "left", cursor: "pointer",
              fontFamily: "'Geist', sans-serif", fontSize: 12.5,
              color: "#0b1220",
            }}
          >
            <span style={{ flex: 1 }}>{c}</span>
            {c === current.category && (
              <svg width={12} height={12} viewBox="0 0 12 12">
                <path d="M2 6l3 3 5-6" stroke="#0f766e" strokeWidth="2"
                  fill="none" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            )}
          </button>
        ))}
        {tab === "area" && allAreas.map(a => (
          <button
            key={a}
            onClick={e => { e.stopPropagation(); onSelect({ area: a }); }}
            style={{
              display: "flex", alignItems: "center", gap: 10,
              width: "100%", padding: "9px 14px",
              border: "none",
              background: a === current.area ? "rgba(15,118,110,0.06)" : "transparent",
              textAlign: "left", cursor: "pointer",
              fontFamily: "'Geist', sans-serif", fontSize: 13,
              color: "#0b1220",
            }}
          >
            <Dot color={colorForArea(a)} />
            <span style={{ flex: 1 }}>{a}</span>
            {a === current.area && (
              <svg width={12} height={12} viewBox="0 0 12 12">
                <path d="M2 6l3 3 5-6" stroke="#0f766e" strokeWidth="2"
                  fill="none" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            )}
          </button>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { CategoriesView, VendorsView });

</script>
<script type="text/babel" data-source="views-savings.jsx">
// Savings detail view + Approach (levers, process) view — Ironclad

function SavingsView() {
  const { categories, totals, filters, colorForArea, timeRange,
          filtersActive, toggleCategoryFilter, clientName, areas } = useStore();
  const scope = categories.filter(c => c.modeled && c.savingsHighDollar > 0);
  const sorted = [...scope].sort((a, b) => b.savingsAvgDollar - a.savingsAvgDollar);
  const isPartial = timeRange.months.length < 12;
  const areaLabel = filters.area === "all" ? null : filters.area;

  if (totals.totalSpend === 0) return <EmptyState />;

  const scenarioValue =
    filters.scenario === "low" ? totals.totalLow
    : filters.scenario === "high" ? totals.totalHigh : totals.totalAvg;

  // Savings by area
  const savingsByArea = {};
  for (const c of scope) {
    const v = filters.scenario === "low" ? c.savingsLowDollar
            : filters.scenario === "high" ? c.savingsHighDollar
            : c.savingsAvgDollar;
    savingsByArea[c.area] = (savingsByArea[c.area] || 0) + v;
  }
  const areaRollup = Object.entries(savingsByArea)
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {/* Hero */}
      <section style={{
        background: "#0b1220", color: "#f8f6f1",
        padding: "32px 36px",
      }}>
        <div style={{
          display: "flex", justifyContent: "space-between",
          alignItems: "flex-start", gap: 24, flexWrap: "wrap",
        }}>
          <div style={{ minWidth: 0, flex: "1 1 320px" }}>
            <Eyebrow style={{ color: "rgba(248,246,241,0.55)" }}>
              {areaLabel ? `${areaLabel} · ` : ""}{timeRange.short} · {ScenarioLabel(filters.scenario)} Scenario
            </Eyebrow>
            <div style={{
              fontFamily: "'Newsreader', serif", fontWeight: 400,
              fontSize: "clamp(40px, 7vw, 64px)", lineHeight: 1, letterSpacing: "-0.025em",
              color: "#5eead4", marginTop: 12,
            }}>
              {fmtMoney(scenarioValue, { decimals: 2 })}
            </div>
            <div style={{
              fontFamily: "'Geist', sans-serif", fontSize: 13.5,
              color: "rgba(248,246,241,0.75)", marginTop: 12, maxWidth: 600, lineHeight: 1.6,
            }}>
              {isPartial ? `${timeRange.short} savings on ` : "Run-rate savings on "}
              {fmtMoney(totals.totalAddressable, { decimals: 2 })} of addressable spend
              {" "}across {scope.length} modeled categories
              {areaLabel ? ` in ${areaLabel}` : ""}.
              {isPartial && (
                <span style={{ display: "block", marginTop: 6,
                  color: "rgba(94,234,212,0.85)",
                  fontFamily: "'JetBrains Mono', monospace", fontSize: 12,
                }}>
                  → Annualized run-rate: {fmtMoney(
                    filters.scenario === "low" ? totals.annualLow :
                    filters.scenario === "high" ? totals.annualHigh :
                    totals.annualAvg,
                    { decimals: 2 }
                  )}
                </span>
              )}
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12, alignItems: "flex-end" }}>
            <div style={{
              display: "flex", gap: 20,
              fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
              color: "rgba(248,246,241,0.6)",
            }}>
              <div style={{ textAlign: "right" }}>
                <div style={{ color: "rgba(248,246,241,0.45)", fontSize: 9, textTransform: "uppercase", letterSpacing: "0.12em" }}>Low</div>
                <div style={{ color: "#f8f6f1", fontSize: 13, marginTop: 4 }}>{fmtMoney(totals.totalLow, { decimals: 2 })}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ color: "rgba(248,246,241,0.45)", fontSize: 9, textTransform: "uppercase", letterSpacing: "0.12em" }}>High</div>
                <div style={{ color: "#f8f6f1", fontSize: 13, marginTop: 4 }}>{fmtMoney(totals.totalHigh, { decimals: 2 })}</div>
              </div>
            </div>
            {filtersActive && (
              <div style={{
                fontFamily: "'Geist', sans-serif", fontSize: 10,
                textTransform: "uppercase", letterSpacing: "0.12em",
                color: "rgba(94,234,212,0.85)",
                padding: "4px 10px",
                border: "1px solid rgba(94,234,212,0.30)",
                borderRadius: 2,
              }}>Filtered view</div>
            )}
          </div>
        </div>
      </section>

      {/* Savings by area rollup */}
      {areaRollup.length > 0 && (
        <Panel
          title="Savings by Area"
          subtitle="Each area aggregates its modeled categories"
        >
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {(() => {
              const maxV = Math.max(...areaRollup.map(([, v]) => v));
              return areaRollup.map(([area, v]) => (
                <div key={area} style={{
                  display: "grid", gridTemplateColumns: "minmax(160px, 220px) 1fr 130px",
                  gap: 14, alignItems: "center",
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <Dot color={colorForArea(area)} />
                    <span style={{
                      fontFamily: "'Geist', sans-serif", fontSize: 13,
                      color: "#0b1220", fontWeight: 500,
                    }}>{area}</span>
                  </div>
                  <div style={{
                    position: "relative", height: 22,
                    background: "rgba(11,18,32,0.04)",
                  }}>
                    <div style={{
                      position: "absolute", left: 0, top: 0, bottom: 0,
                      width: `${(v / maxV) * 100}%`,
                      background: colorForArea(area),
                    }} />
                  </div>
                  <div style={{
                    fontFamily: "'JetBrains Mono', monospace", fontSize: 12,
                    color: "#0f766e", textAlign: "right", fontWeight: 500,
                  }}>{fmtMoney(v, { decimals: 2 })}</div>
                </div>
              ));
            })()}
          </div>
        </Panel>
      )}

      {/* Per-category breakdown */}
      <div style={{
        display: "grid",
        gridTemplateColumns: "repeat(auto-fit, minmax(360px, 1fr))",
        gap: 14,
      }}>
        {sorted.map(c => (
          <CategorySavingsCard key={c.id} category={c} scenario={filters.scenario} />
        ))}
      </div>

      {/* Multi-year projection */}
      <Panel
        title="Three-Year Run-Rate Projection"
        subtitle="Assumes typical mid-year-1 negotiations close · annualized · most-likely scenario"
      >
        <ProjectionChart total={isPartial ? totals.annualAvg : totals.totalAvg} />
      </Panel>
    </div>
  );
}

function CategorySavingsCard({ category, scenario }) {
  const { colorForArea } = useStore();
  const color = colorForArea(category.area);
  const value = scenario === "low" ? category.savingsLowDollar
              : scenario === "high" ? category.savingsHighDollar
              : category.savingsAvgDollar;
  const addressableDollar = category.liveSpend * category.addressable;
  const savingsRate = addressableDollar > 0 ? value / addressableDollar : 0;

  return (
    <div style={{
      background: "#fff", border: "1px solid rgba(11,18,32,0.08)",
      padding: "24px 28px", display: "flex", flexDirection: "column", gap: 16,
    }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
        <div style={{
          width: 4, height: 40, background: color, flexShrink: 0,
        }} />

function ProjectionChart({ total }) {
  const years = [
    { year: "Year 1", realized: total * 0.5, label: "Negotiations close · partial-year capture" },
    { year: "Year 2", realized: total * 1.0, label: "Full run-rate · all categories live" },
    { year: "Year 3", realized: total * 1.05, label: "Continuous improvement layer" },
  ];
  const max = Math.max(...years.map(y => y.realized));
  const cumulative = years.reduce((acc, y, i) => {
    const prev = acc[i - 1]?.cumValue || 0;
    acc.push({ ...y, cumValue: prev + y.realized });
    return acc;
  }, []);

  return (
    <div style={{
      display: "grid",
      gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))",
      gap: 28,
    }}>
      {cumulative.map((y, i) => (
        <div key={i}>
          <Eyebrow>{y.year}</Eyebrow>
          <div style={{
            fontFamily: "'Newsreader', serif", fontWeight: 400, fontSize: 36,
            color: "#0b1220", letterSpacing: "-0.02em", marginTop: 8,
          }}>{fmtMoney(y.realized, { decimals: 2 })}</div>
          <div style={{
            fontFamily: "'Geist', sans-serif", fontSize: 12,
            color: "#6b7280", marginTop: 4,
          }}>realized this year</div>
          <div style={{
            height: 8, background: "rgba(11,18,32,0.04)", marginTop: 16, position: "relative",
          }}>
            <div style={{
              position: "absolute", left: 0, top: 0, bottom: 0,
              width: `${(y.realized / (max || 1)) * 100}%`,
              background: "#0f766e",
            }} />
          </div>
          <div style={{
            fontFamily: "'Geist', sans-serif", fontSize: 11.5,
            color: "#4a5568", marginTop: 12, fontStyle: "italic",
          }}>{y.label}</div>
          <div style={{
            fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
            color: "#0f766e", marginTop: 8, paddingTop: 8,
            borderTop: "1px dashed rgba(11,18,32,0.10)",
          }}>Cumulative: {fmtMoney(y.cumValue, { decimals: 2 })}</div>
        </div>
      ))}
    </div>
  );
}

          border: "1px solid rgba(248,246,241,0.30)",
          color: "#f8f6f1",
          fontFamily: "'Geist', sans-serif", fontSize: 11, fontWeight: 500,
          padding: "5px 12px", borderRadius: 2, cursor: "pointer",
          textTransform: "uppercase", letterSpacing: "0.08em",
          display: "inline-flex", alignItems: "center", gap: 6, whiteSpace: "nowrap",
        }}>
          <svg width={10} height={10} viewBox="0 0 10 10">
            <path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
          </svg>
          Clear filters
        </button>
      )}
      {!filtersActive && (
        <span style={{
          fontFamily: "'Geist', sans-serif", fontSize: 10,
          textTransform: "uppercase", letterSpacing: "0.10em", color: "#6b7280",
          whiteSpace: "nowrap",
        }}>Live model · changes apply across all views</span>
      )}
    </div>
  );
}

function FilterPill({ label, value, onChange, options, active, dark }) {
  const fg = dark ? "#f8f6f1" : "#0b1220";
  const subtle = dark ? "rgba(248,246,241,0.55)" : "#6b7280";
  return (
    <label style={{
      display: "inline-flex", alignItems: "center", gap: 8,
      padding: "5px 8px 5px 12px",
      background: dark ? "rgba(248,246,241,0.06)" : "#fff",
      border: `1px solid ${dark ? "rgba(248,246,241,0.16)" : "rgba(11,18,32,0.12)"}`,
      borderRadius: 2,
      cursor: "pointer", position: "relative",
    }}>
      <span style={{
        fontFamily: "'Geist', sans-serif", fontSize: 9.5,
        textTransform: "uppercase", letterSpacing: "0.12em", color: subtle,
        whiteSpace: "nowrap",
      }}>{label}</span>
      <span style={{
        fontFamily: "'Geist', sans-serif", fontSize: 12, color: fg,
        fontWeight: 500, whiteSpace: "nowrap",
        display: "inline-flex", alignItems: "center", gap: 4,
      }}>
        {options.find(o => o.value === value)?.label}
        {active && (
          <span style={{
            width: 5, height: 5, borderRadius: "50%",
            background: "#5eead4", marginLeft: 2,
          }} />
        )}
      </span>
      <svg width={10} height={6} viewBox="0 0 10 6" style={{ color: subtle, marginLeft: -2 }}>
        <path d="M1 1l4 4 4-4" stroke="currentColor" strokeWidth="1.4"
          fill="none" strokeLinecap="round" />
      </svg>
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        style={{
          position: "absolute", inset: 0, opacity: 0, cursor: "pointer",
          fontFamily: "inherit",
        }}
      >
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </label>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

</body>
</html>
